name: Recover storefront domains once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-storefront-domains-once.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    env:
      DOKPLOY_URL: https://dokploy.dezgre.com
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Recover routes
        shell: bash
        run: |
          set -euo pipefail
          status=UNKNOWN
          if [ -z "${DOKPLOY_API_KEY:-}" ]; then
            status=NO_SECRET
          else
            projects="$(mktemp)"
            if curl --fail-with-body --silent --show-error \
              -H "Accept: application/json" \
              -H "x-api-key: ${DOKPLOY_API_KEY}" \
              "${DOKPLOY_URL}/api/project.all" > "$projects"; then
              app_id="$(jq -r '[.. | objects | select((.name? // "" | ascii_downcase) == "dezgre-system") | .applicationId?] | map(select(type == "string" and length > 0)) | first // empty' "$projects")"
              if [ -n "$app_id" ]; then
                current="$(mktemp)"
                curl --fail-with-body --silent --show-error \
                  -H "Accept: application/json" \
                  -H "x-api-key: ${DOKPLOY_API_KEY}" \
                  "${DOKPLOY_URL}/api/domain.byApplicationId?applicationId=${app_id}" > "$current"
                for host in nativaperu.work aitanaperu.com www.aitanaperu.com; do
                  if jq -e --arg host "$host" '[.. | objects | .host?] | any(. == $host)' "$current" >/dev/null; then
                    continue
                  fi
                  payload="$(jq -nc --arg host "$host" --arg applicationId "$app_id" '{host:$host,path:"/",internalPath:"/",port:3000,https:true,certificateType:"letsencrypt",applicationId:$applicationId,domainType:"application",stripPath:false,forwardAuthEnabled:false}')"
                  curl --fail-with-body --silent --show-error \
                    -X POST \
                    -H "Accept: application/json" \
                    -H "Content-Type: application/json" \
                    -H "x-api-key: ${DOKPLOY_API_KEY}" \
                    --data "$payload" \
                    "${DOKPLOY_URL}/api/domain.create" >/dev/null
                done
                status=SUCCESS
              else
                status=APPLICATION_NOT_FOUND
              fi
            else
              status=API_ERROR
            fi
          fi
          printf '%s\n' "$status" > .storefront-domain-recovery-result
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .storefront-domain-recovery-result
          git commit -m "Record storefront domain recovery result"
          git push
