name: Temporary Mobile v0.1.7 performance patch

on:
  push:
    branches:
      - mobile-app-v1-build
    paths:
      - '.github/workflows/tmp-mobile-v017-performance.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply app-only performance patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          java_path = Path('app/src/main/java/com/dezgre/mobile/PanelWebActivity.java')
          source = java_path.read_text(encoding='utf-8')
          old_scroll = '        webView.setLayerType(View.LAYER_TYPE_HARDWARE, null);\n        webView.setOverScrollMode(View.OVER_SCROLL_NEVER);'
          new_scroll = old_scroll + '\n        webView.setVerticalScrollBarEnabled(false);\n        webView.setHorizontalScrollBarEnabled(false);'
          if source.count(old_scroll) != 1:
              raise SystemExit('Expected one WebView scroll block')
          source = source.replace(old_scroll, new_scroll, 1)
          if source.count('DEZGRE-Mobile/0.1.6') != 1:
              raise SystemExit('Expected one v0.1.6 user agent')
          source = source.replace('DEZGRE-Mobile/0.1.6', 'DEZGRE-Mobile/0.1.7', 1)
          source = source.replace('        if (Build.VERSION.SDK_INT >= 23) settings.setOffscreenPreRaster(true);\n', '', 1)
          start = source.find('    private void applyNativePanelFixes(WebView view) {')
          end = source.find('    private boolean handleNavigation(Uri uri) {', start)
          if start < 0 or end < 0:
              raise SystemExit('Native panel fix method markers not found')
          method = base64.b64decode('  e3RyYW5zZm9ybTp0cmFuc2xhdGUzZCgwLDAsMCl9NTAl e3RyYW5zZm9ybTp0cmFuc2xhdGUzZCgwLC0zcHgsMCl9fUB rZXlmcmFtZXMgZGV6Z3JlTW9iaWxlTmF0aUlu ').decode('utf-8')
          source = source[:start] + method + source[end:]
          java_path.write_text(source, encoding='utf-8')
          gradle_path = Path('app/build.gradle')
          gradle = gradle_path.read_text(encoding='utf-8')
          old = "def buildVersionName = '0.1.6'"
          new = "def buildVersionName = '0.1.7'"
          if gradle.count(old) != 1:
              raise SystemExit('Expected one v0.1.6 Gradle declaration')
          gradle_path.write_text(gradle.replace(old, new, 1), encoding='utf-8')
          PY
          grep -q 'DEZGRE-Mobile/0.1.7' app/src/main/java/com/dezgre/mobile/PanelWebActivity.java
          grep -q 'dezgre-native-app-fixes-v017' app/src/main/java/com/dezgre/mobile/PanelWebActivity.java
          grep -q "def buildVersionName = '0.1.7'" app/build.gradle
      - name: Commit app-only code
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/dezgre/mobile/PanelWebActivity.java app/build.gradle
          git commit -m 'perf(mobile): smooth NATI and fix viewport backgrounds v0.1.7'
          git push origin HEAD:mobile-app-v1-build
