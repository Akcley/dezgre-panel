name: Temporary Mobile v0.1.7 Java correction

on:
  push:
    branches:
      - mobile-app-v1-build
    paths:
      - '.github/workflows/tmp-mobile-v017-fix-java.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace exact native fix method
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          path = Path('app/src/main/java/com/dezgre/mobile/PanelWebActivity.java')
          source = path.read_text(encoding='utf-8')
          start = source.find('    private void applyNativePanelFixes(WebView view) {')
          end = source.find('    private boolean handleNavigation(Uri uri) {', start)
          if start < 0 or end < 0:
              raise SystemExit('Method markers not found')
          method = base64.b64decode('').decode('utf-8')
          path.write_text(source[:start] + method + source[end:], encoding='utf-8')
          PY
          grep -q 'String javascript = "(function(){"' app/src/main/java/com/dezgre/mobile/PanelWebActivity.java
          grep -q 'opacity:.72' app/src/main/java/com/dezgre/mobile/PanelWebActivity.java
          grep -q 'box-shadow:0 14px 34px rgba(0,0,0,.16)!important' app/src/main/java/com/dezgre/mobile/PanelWebActivity.java
      - name: Commit corrected Java only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/dezgre/mobile/PanelWebActivity.java
          git commit -m 'fix(mobile): correct v0.1.7 native WebView injector'
          git push origin HEAD:mobile-app-v1-build
