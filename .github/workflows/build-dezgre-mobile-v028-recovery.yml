name: Temporary DEZGRE Mobile 0.1.28 Recovery Build

on:
  workflow_dispatch:
  push:
    branches:
      - mobile-app-v1-build
    paths:
      - '.github/workflows/build-dezgre-mobile-v028-recovery.yml'

permissions:
  contents: read

jobs:
  android-recovery-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout mobile branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install Android 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Restore new stable signing identity
        uses: actions/cache@v4
        with:
          path: .signing-v2
          key: dezgre-mobile-preview-signing-v2-20261026

      - name: Create or restore stable signing identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .signing-v2
          if [ ! -s .signing-v2/dezgre-preview-v2.jks ] || [ ! -s .signing-v2/signing.env ]; then
            STOREPASS="$(openssl rand -hex 24)"
            keytool -genkeypair               -keystore .signing-v2/dezgre-preview-v2.jks               -storepass "$STOREPASS"               -keypass "$STOREPASS"               -alias dezgre-preview-v2               -keyalg RSA               -keysize 3072               -validity 10000               -dname "CN=DEZGRE Mobile Preview 2026,O=DEZGRE,C=PE"               -noprompt
            {
              echo "STOREPASS=$STOREPASS"
              echo "KEYPASS=$STOREPASS"
              echo "KEYALIAS=dezgre-preview-v2"
            } > .signing-v2/signing.env
            chmod 600 .signing-v2/dezgre-preview-v2.jks .signing-v2/signing.env
          fi
          source .signing-v2/signing.env
          echo "::add-mask::$STOREPASS"
          echo "::add-mask::$KEYPASS"
          echo "DEZGRE_PREVIEW_KEYSTORE=${GITHUB_WORKSPACE}/.signing-v2/dezgre-preview-v2.jks" >> "$GITHUB_ENV"
          echo "DEZGRE_PREVIEW_STORE_PASSWORD=$STOREPASS" >> "$GITHUB_ENV"
          echo "DEZGRE_PREVIEW_KEY_ALIAS=$KEYALIAS" >> "$GITHUB_ENV"
          echo "DEZGRE_PREVIEW_KEY_PASSWORD=$KEYPASS" >> "$GITHUB_ENV"
          keytool -list -v             -keystore .signing-v2/dezgre-preview-v2.jks             -storepass "$STOREPASS"             -alias "$KEYALIAS" | grep -E 'Alias name:|SHA256:|Valid from:'

      - name: Reassemble generated Java source
        shell: bash
        run: cat app/src/main/java/com/dezgre/mobile/MainActivity.java.part* > app/src/main/java/com/dezgre/mobile/MainActivity.java

      - name: Wire mobile sources
        shell: bash
        run: python3 scripts/patch-mobile-mainactivity.py

      - name: Build DEZGRE Mobile 0.1.28
        shell: bash
        env:
          DEZGRE_VERSION_CODE: ${{ github.run_number }}
          DEZGRE_VERSION_NAME: 0.1.28
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: Stage and verify APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery-out
          cp app/build/outputs/apk/debug/app-debug.apk recovery-out/DEZGRE-Mobile-v0.1.28.apk
          sha256sum recovery-out/DEZGRE-Mobile-v0.1.28.apk | tee recovery-out/DEZGRE-Mobile-v0.1.28.apk.sha256
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs             recovery-out/DEZGRE-Mobile-v0.1.28.apk | tee recovery-out/DEZGRE-Mobile-v0.1.28.cert.txt
          unzip -t recovery-out/DEZGRE-Mobile-v0.1.28.apk >/dev/null

      - name: Encrypt signing backup for recovery
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/recovery-public.pem <<'PUBKEY'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEA7Q9O70Kv1E4vzdN8qMJz
          jOlxThNXSLRFkkosFDp9McTskxqYqRmnrPBcgMvhKFi+Db2g76Amh8u/60/4t3ya
          y2hIPMFls5GBamvHyv2WUq1/yZNV5aNSNRLDYoy+HQ8Tdjvh3kINug5MPdP51DFN
          NTIptAJPOkz+DzjtM/h+M2iF5y4EH7xLjXSx1CuxusxNYEOgXqODJXll0iwRQEGc
          BAroLFsdUsxjXANn0cfP2TNaENPHqQBpF1KaOwzJ+tdJs56xrd9oHUVrjtLl7xLd
          i9CYhnWMg3ZgTPzKxNil/Lg2KOb3x97cN0nUNazIr3CMCzv9DJrlf+YtRY6ops1W
          ihjesEGWlH8Ic/vQffJCq/WVWVlBEUaWFB93ZGFhSI79zrZ65z3NcZvdKoLx48Sz
          xMGz3/k2o/W8IfNgtfisYdvrfbCFx7j6An0D1JwOL2ic8vDXAMr1//VSRWqtx7vY
          axG7FNDzMsrs+go1JpaHSkCd4S8lNyYMwOiskNyU52zBAgMBAAE=
          -----END PUBLIC KEY-----
          PUBKEY
          tar -czf /tmp/dezgre-signing-backup.tar.gz             .signing-v2/dezgre-preview-v2.jks .signing-v2/signing.env
          RECOVERY_KEY="$(openssl rand -hex 32)"
          echo "::add-mask::$RECOVERY_KEY"
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000             -in /tmp/dezgre-signing-backup.tar.gz             -out recovery-out/dezgre-signing-backup.enc             -pass pass:"$RECOVERY_KEY"
          printf '%s' "$RECOVERY_KEY" | openssl pkeyutl -encrypt             -pubin -inkey /tmp/recovery-public.pem             -pkeyopt rsa_padding_mode:oaep             -pkeyopt rsa_oaep_md:sha256             -out recovery-out/dezgre-signing-backup.key.enc
          sha256sum recovery-out/dezgre-signing-backup.enc > recovery-out/dezgre-signing-backup.enc.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DEZGRE-Mobile-v0.1.28-recovery-build
          path: |
            recovery-out/DEZGRE-Mobile-v0.1.28.apk
            recovery-out/DEZGRE-Mobile-v0.1.28.apk.sha256
            recovery-out/DEZGRE-Mobile-v0.1.28.cert.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload encrypted signing backup
        uses: actions/upload-artifact@v4
        with:
          name: DEZGRE-Mobile-v0.1.28-encrypted-signing-backup
          path: |
            recovery-out/dezgre-signing-backup.enc
            recovery-out/dezgre-signing-backup.key.enc
            recovery-out/dezgre-signing-backup.enc.sha256
          if-no-files-found: error
          retention-days: 7
