name: Temporary restore DEZGRE signing v2 and build 0.1.29

on:
  workflow_dispatch:
  push:
    branches: [mobile-app-v1-build]
    paths:
      - '.github/workflows/restore-signing-and-build-v0129.yml'
      - '.recovery-signing-v2/**'

permissions:
  contents: write

jobs:
  restore-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install Android 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Restore temporary recovery RSA
        uses: actions/cache@v4
        with:
          path: .recovery-rsa
          key: dezgre-signing-recovery-rsa-20261107-v1

      - name: Create recovery RSA once
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .recovery-rsa
          if [ ! -s .recovery-rsa/private.pem ]; then
            openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out .recovery-rsa/private.pem
            openssl pkey -in .recovery-rsa/private.pem -pubout -out .recovery-rsa/public.pem
          fi
          chmod 600 .recovery-rsa/private.pem

      - name: Upload recovery public key
        uses: actions/upload-artifact@v4
        with:
          name: DEZGRE-signing-recovery-public-key
          path: .recovery-rsa/public.pem
          retention-days: 2

      - name: Detect encrypted signing payload
        id: payload
        shell: bash
        run: |
          if [ -s .recovery-signing-v2/bundle.enc.b64 ] && [ -s .recovery-signing-v2/key.enc.b64 ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore stable signing cache target
        if: steps.payload.outputs.present == 'true'
        uses: actions/cache@v4
        with:
          path: .signing-v2
          key: dezgre-mobile-preview-signing-v2-20261026

      - name: Decrypt owner signing backup
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .signing-v2 /tmp/dezgre-recovery
          base64 -d .recovery-signing-v2/key.enc.b64 > /tmp/dezgre-recovery/key.enc
          openssl pkeyutl -decrypt             -inkey .recovery-rsa/private.pem             -pkeyopt rsa_padding_mode:oaep             -pkeyopt rsa_oaep_md:sha256             -in /tmp/dezgre-recovery/key.enc             -out /tmp/dezgre-recovery/pass.txt
          base64 -d .recovery-signing-v2/bundle.enc.b64 > /tmp/dezgre-recovery/bundle.enc
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000             -in /tmp/dezgre-recovery/bundle.enc             -out /tmp/dezgre-recovery/bundle.tar.gz             -pass file:/tmp/dezgre-recovery/pass.txt
          tar -xzf /tmp/dezgre-recovery/bundle.tar.gz -C .signing-v2
          test -s .signing-v2/dezgre-preview-v2.jks
          test -s .signing-v2/signing.env
          source .signing-v2/signing.env
          echo "::add-mask::$STOREPASS"
          echo "::add-mask::$KEYPASS"
          keytool -list -v -keystore .signing-v2/dezgre-preview-v2.jks -storepass "$STOREPASS" -alias "$KEYALIAS" > .signing-v2/certificate.txt
          grep -q '1D:12:FC:7E:42:F7:02:34:63:5E:3F:8C:04:0E:81:AB:0A:3E:F1:CA:06:2C:C2:A1:05:86:50:11:5F:60:82:DD' .signing-v2/certificate.txt
          echo "DEZGRE_PREVIEW_KEYSTORE=${GITHUB_WORKSPACE}/.signing-v2/dezgre-preview-v2.jks" >> "$GITHUB_ENV"
          echo "DEZGRE_PREVIEW_STORE_PASSWORD=$STOREPASS" >> "$GITHUB_ENV"
          echo "DEZGRE_PREVIEW_KEY_ALIAS=$KEYALIAS" >> "$GITHUB_ENV"
          echo "DEZGRE_PREVIEW_KEY_PASSWORD=$KEYPASS" >> "$GITHUB_ENV"
          rm -rf /tmp/dezgre-recovery

      - name: Reassemble generated Java source
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: cat app/src/main/java/com/dezgre/mobile/MainActivity.java.part* > app/src/main/java/com/dezgre/mobile/MainActivity.java

      - name: Wire mobile sources
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: python3 scripts/patch-mobile-mainactivity.py

      - name: Build 0.1.29 with restored stable signature
        if: steps.payload.outputs.present == 'true'
        shell: bash
        env:
          DEZGRE_VERSION_CODE: ${{ github.run_number }}
          DEZGRE_VERSION_NAME: 0.1.29
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: Stage and verify signed APK
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/DEZGRE-Mobile-v0.1.29.apk
          sha256sum dist/DEZGRE-Mobile-v0.1.29.apk | tee dist/DEZGRE-Mobile-v0.1.29.apk.sha256
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/DEZGRE-Mobile-v0.1.29.apk | tee dist/DEZGRE-Mobile-v0.1.29.cert.txt
          grep -q 'Signer #1 certificate SHA-256 digest: 1d12fc7e42f70234635e3f8c040e81ab0a3ef1ca062cc2a1058650115f6082dd' dist/DEZGRE-Mobile-v0.1.29.cert.txt
          unzip -t dist/DEZGRE-Mobile-v0.1.29.apk >/dev/null

      - name: Upload signed APK
        if: steps.payload.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: DEZGRE-Mobile-v0.1.29
          path: |
            dist/DEZGRE-Mobile-v0.1.29.apk
            dist/DEZGRE-Mobile-v0.1.29.apk.sha256
            dist/DEZGRE-Mobile-v0.1.29.cert.txt
          retention-days: 30

      - name: Publish signed APK
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Akcley@users.noreply.github.com"
          git add -f dist/DEZGRE-Mobile-v0.1.29.apk dist/DEZGRE-Mobile-v0.1.29.apk.sha256 dist/DEZGRE-Mobile-v0.1.29.cert.txt
          if ! git diff --cached --quiet; then
            git commit -m "build: publish DEZGRE Mobile v0.1.29 APK [skip ci]"
            git push origin HEAD:mobile-app-v1-build
          fi
