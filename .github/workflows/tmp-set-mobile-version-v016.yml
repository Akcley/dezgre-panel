name: Temporary set Mobile internal version 0.1.6

on:
  push:
    branches:
      - mobile-app-v1-build
    paths:
      - '.github/workflows/tmp-set-mobile-version-v016.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set exact internal app version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle')
          s = p.read_text()
          old = "def buildVersionName = '0.1.5'"
          new = "def buildVersionName = '0.1.6'"
          if s.count(old) != 1:
              raise SystemExit('Expected one 0.1.5 versionName declaration')
          p.write_text(s.replace(old, new, 1))
          PY
          grep -q "def buildVersionName = '0.1.6'" app/build.gradle
      - name: Commit only Gradle version
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle
          git commit -m 'build(mobile): set internal version 0.1.6'
          git push origin HEAD:mobile-app-v1-build
