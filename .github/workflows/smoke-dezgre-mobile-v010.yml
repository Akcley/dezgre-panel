name: Smoke DEZGRE Mobile v0.1.0

on:
  push:
    branches:
      - mobile-app-v1-build
    paths:
      - '.github/workflows/smoke-dezgre-mobile-v010.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated mobile branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 build dependencies
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Reassemble generated Java source
        shell: bash
        run: cat app/src/main/java/com/dezgre/mobile/MainActivity.java.part* > app/src/main/java/com/dezgre/mobile/MainActivity.java

      - name: Build exact debug APK
        shell: bash
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Static security gate
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          file "$APK"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK"
          grep -R --line-number --fixed-strings 'https://api.dezgre.com/v1' app/src/main/java app/build.gradle
          grep -R --line-number --fixed-strings 'AndroidKeyStore' app/src/main/java
          grep -R --line-number --fixed-strings 'AES/GCM/NoPadding' app/src/main/java
          python3 - <<'PY'
          import pathlib, zipfile

          sources = []
          for p in pathlib.Path('app/src/main').rglob('*'):
              if p.is_file():
                  try:
                      sources.append(p.read_text(errors='ignore'))
                  except Exception:
                      pass
          source = '\n'.join(sources)
          assert 'API_AUTH_SECRET' not in source
          assert 'AUTH_SECRET' not in source
          with zipfile.ZipFile('app/build/outputs/apk/debug/app-debug.apk') as z:
              dex = z.read('classes.dex')
          assert b'API_AUTH_SECRET' not in dex
          assert b'AUTH_SECRET' not in dex
          assert b'-----BEGIN PRIVATE KEY-----' not in dex
          assert b'-----BEGIN RSA PRIVATE KEY-----' not in dex
          assert b'-----BEGIN EC PRIVATE KEY-----' not in dex
          assert b'https://api.dezgre.com/v1' in dex
          print('STATIC_SECURITY=PASS')
          PY

      - name: LIVE API public/invalid-token smoke
        shell: bash
        run: |
          set -euo pipefail
          HEALTH="$(curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 20 https://api.dezgre.com/v1/health)"
          echo "$HEALTH" | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x.get("ok") is True; assert x.get("service")=="dezgre-api"; assert x.get("version")==1'
          code="$(curl --silent --show-error --connect-timeout 10 --max-time 20 -o /tmp/invalid.json -w '%{http_code}' -H 'Authorization: Bearer definitely-invalid-dezgre-mobile-token' https://api.dezgre.com/v1/me)"
          cat /tmp/invalid.json
          test "$code" = '401'
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/invalid.json'))
          err=x.get('error') or {}
          code=err.get('code') if isinstance(err,dict) else x.get('code')
          assert code in {'INVALID_API_TOKEN','MISSING_API_TOKEN','API_TOKEN_EXPIRED'}, x
          print('LIVE_INVALID_BEARER=PASS')
          PY

      - name: Install and launch real APK in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail
            APK=app/build/outputs/apk/debug/app-debug.apk
            PKG=com.dezgre.mobile.preview
            ACT=com.dezgre.mobile.MainActivity
            adb install -r "$APK"
            adb shell pm path "$PKG" | grep -F 'package:'
            adb shell am start -W -n "$PKG/$ACT"
            sleep 2
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml /tmp/window-fresh.xml >/dev/null
            grep -F 'Iniciar sesión' /tmp/window-fresh.xml
            grep -F 'Correo electrónico' /tmp/window-fresh.xml
            grep -F 'Contraseña' /tmp/window-fresh.xml
            test -n "$(adb shell pidof "$PKG" | tr -d '\r')"

            adb shell am force-stop "$PKG"
            adb shell am start -W -n "$PKG/$ACT"
            sleep 2
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml /tmp/window-reopen.xml >/dev/null
            grep -F 'Iniciar sesión' /tmp/window-reopen.xml
            test -n "$(adb shell pidof "$PKG" | tr -d '\r')"

            adb shell am force-stop "$PKG"
            adb shell "run-as $PKG sh -c 'mkdir -p shared_prefs; printf \"<?xml version=\\\"1.0\\\" encoding=\\\"utf-8\\\" standalone=\\\"yes\\\" ?><map><string name=\\\"api_v1_bearer\\\">not-encrypted</string></map>\" > shared_prefs/dezgre_mobile_secure.xml'"
            adb shell am start -W -n "$PKG/$ACT"
            sleep 2
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml /tmp/window-invalid-token.xml >/dev/null
            grep -F 'Iniciar sesión' /tmp/window-invalid-token.xml
            test -n "$(adb shell pidof "$PKG" | tr -d '\r')"

            adb shell "run-as $PKG sh -c 'grep -R -i password shared_prefs 2>/dev/null && exit 9 || true'"
            adb shell dumpsys package "$PKG" | grep -E 'versionCode=1|versionName=0.1.0-preview' | head -4
            if adb logcat -d '*:E' | grep -E 'Process: com\.dezgre\.mobile\.preview|FATAL EXCEPTION' >/tmp/dezgre-fatal.log; then
              cat /tmp/dezgre-fatal.log
              exit 1
            fi

      - name: Smoke summary
        shell: bash
        run: |
          echo 'APK_INSTALL=PASS'
          echo 'APP_OPEN=PASS'
          echo 'APP_REOPEN=PASS'
          echo 'CORRUPT_TOKEN_TO_LOGIN=PASS'
          echo 'LIVE_HEALTH=PASS'
          echo 'LIVE_INVALID_BEARER=PASS'
          echo 'STATIC_SECURITY=PASS'
