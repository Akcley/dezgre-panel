name: Build DEZGRE Mobile APK

on:
  workflow_dispatch:
  push:
    branches:
      - mobile-app-v1-build
    paths-ignore:
      - 'dist/**'

permissions:
  contents: write

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout isolated mobile branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install Android 35 from runner SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=${ANDROID_HOME}"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Restore stable preview signing key
        id: preview-signing-cache
        uses: actions/cache@v4
        with:
          path: .signing/dezgre-preview.jks
          key: dezgre-mobile-preview-signing-v1

      - name: Bootstrap preview signing key once
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .signing
          if [ ! -s .signing/dezgre-preview.jks ]; then
            keytool -genkeypair \
              -keystore .signing/dezgre-preview.jks \
              -storepass dezgre-preview-v1 \
              -keypass dezgre-preview-v1 \
              -alias dezgre-preview \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=DEZGRE Mobile Preview,O=DEZGRE,C=PE" \
              -noprompt
          fi
          keytool -list -v \
            -keystore .signing/dezgre-preview.jks \
            -storepass dezgre-preview-v1 \
            -alias dezgre-preview | grep -E 'SHA256:|Alias name:|Valid from:'

      - name: Reassemble generated Java source
        shell: bash
        run: cat app/src/main/java/com/dezgre/mobile/MainActivity.java.part* > app/src/main/java/com/dezgre/mobile/MainActivity.java

      - name: Build APK with stable preview signature
        shell: bash
        env:
          DEZGRE_PREVIEW_KEYSTORE: ${{ github.workspace }}/.signing/dezgre-preview.jks
          DEZGRE_PREVIEW_STORE_PASSWORD: dezgre-preview-v1
          DEZGRE_PREVIEW_KEY_ALIAS: dezgre-preview
          DEZGRE_PREVIEW_KEY_PASSWORD: dezgre-preview-v1
          DEZGRE_VERSION_CODE: ${{ github.run_number }}
          DEZGRE_VERSION_NAME: 0.1.3
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Stage APK checksum and verify update signature
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/DEZGRE-Mobile-v0.1.3.apk
          sha256sum dist/DEZGRE-Mobile-v0.1.3.apk | tee dist/DEZGRE-Mobile-v0.1.3.apk.sha256
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/DEZGRE-Mobile-v0.1.3.apk | tee dist/DEZGRE-Mobile-v0.1.3.cert.txt
          grep -q "Signer #1 certificate SHA-256 digest: 725c0ec1a72c7bfd083acf5c4cec3d1d3c720a5e3d3786b3e09b0c5936aefbbb" dist/DEZGRE-Mobile-v0.1.3.cert.txt
          unzip -t dist/DEZGRE-Mobile-v0.1.3.apk >/dev/null

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DEZGRE-Mobile-v0.1.3
          path: |
            dist/DEZGRE-Mobile-v0.1.3.apk
            dist/DEZGRE-Mobile-v0.1.3.apk.sha256
            dist/DEZGRE-Mobile-v0.1.3.cert.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK on isolated branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Akcley@users.noreply.github.com"
          git add -f dist/DEZGRE-Mobile-v0.1.3.apk dist/DEZGRE-Mobile-v0.1.3.apk.sha256 dist/DEZGRE-Mobile-v0.1.3.cert.txt
          if ! git diff --cached --quiet; then
            git commit -m "build: publish DEZGRE Mobile v0.1.3 APK [skip ci]"
            git push origin HEAD:mobile-app-v1-build
          fi
