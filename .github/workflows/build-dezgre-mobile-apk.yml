name: Build DEZGRE Mobile APK

on:
  workflow_dispatch:
  push:
    branches:
      - mobile-app-v1-build
    paths-ignore:
      - 'dist/**'

permissions:
  contents: write

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout isolated mobile branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install Android 35 from runner SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=${ANDROID_HOME}"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Restore stable preview signing identity v2
        uses: actions/cache@v4
        with:
          path: .signing-v2
          key: dezgre-mobile-preview-signing-v2-20261026

      - name: Verify stable signing identity v2
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s .signing-v2/dezgre-preview-v2.jks ] || [ ! -s .signing-v2/signing.env ]; then
            echo "::error::Stable v2 signing backup is missing. Restore dezgre-preview-v2.jks from the owner backup; never generate another identity."
            exit 1
          fi
          source .signing-v2/signing.env
          echo "::add-mask::$STOREPASS"
          echo "::add-mask::$KEYPASS"
          echo "DEZGRE_PREVIEW_KEYSTORE=${GITHUB_WORKSPACE}/.signing-v2/dezgre-preview-v2.jks" >> "$GITHUB_ENV"
          echo "DEZGRE_PREVIEW_STORE_PASSWORD=$STOREPASS" >> "$GITHUB_ENV"
          echo "DEZGRE_PREVIEW_KEY_ALIAS=$KEYALIAS" >> "$GITHUB_ENV"
          echo "DEZGRE_PREVIEW_KEY_PASSWORD=$KEYPASS" >> "$GITHUB_ENV"
          keytool -list -v             -keystore .signing-v2/dezgre-preview-v2.jks             -storepass "$STOREPASS"             -alias "$KEYALIAS" > .signing-v2/certificate.txt
          grep -q '1D:12:FC:7E:42:F7:02:34:63:5E:3F:8C:04:0E:81:AB:0A:3E:F1:CA:06:2C:C2:A1:05:86:50:11:5F:60:82:DD' .signing-v2/certificate.txt

      - name: Reassemble generated Java source
        shell: bash
        run: cat app/src/main/java/com/dezgre/mobile/MainActivity.java.part* > app/src/main/java/com/dezgre/mobile/MainActivity.java

      - name: Wire V1 mobile routes
        shell: bash
        run: python3 scripts/patch-mobile-mainactivity.py

      - name: Build APK with stable preview signature
        shell: bash
        env:
          DEZGRE_VERSION_CODE: ${{ github.run_number }}
          DEZGRE_VERSION_NAME: 0.1.28
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: Stage APK checksum and verify update signature
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/DEZGRE-Mobile-v0.1.28.apk
          sha256sum dist/DEZGRE-Mobile-v0.1.28.apk | tee dist/DEZGRE-Mobile-v0.1.28.apk.sha256
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/DEZGRE-Mobile-v0.1.28.apk | tee dist/DEZGRE-Mobile-v0.1.28.cert.txt
          grep -q "Signer #1 certificate SHA-256 digest: 1d12fc7e42f70234635e3f8c040e81ab0a3ef1ca062cc2a1058650115f6082dd" dist/DEZGRE-Mobile-v0.1.28.cert.txt
          unzip -t dist/DEZGRE-Mobile-v0.1.28.apk >/dev/null

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DEZGRE-Mobile-v0.1.28
          path: |
            dist/DEZGRE-Mobile-v0.1.28.apk
            dist/DEZGRE-Mobile-v0.1.28.apk.sha256
            dist/DEZGRE-Mobile-v0.1.28.cert.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK on isolated branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Akcley@users.noreply.github.com"
          git add -f dist/DEZGRE-Mobile-v0.1.28.apk dist/DEZGRE-Mobile-v0.1.28.apk.sha256 dist/DEZGRE-Mobile-v0.1.28.cert.txt
          if ! git diff --cached --quiet; then
            git commit -m "build: publish DEZGRE Mobile v0.1.28 APK [skip ci]"
            git push origin HEAD:mobile-app-v1-build
          fi
