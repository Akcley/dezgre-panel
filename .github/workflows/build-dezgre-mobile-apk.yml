name: Build DEZGRE Mobile APK

on:
  workflow_dispatch:
  push:
    branches:
      - mobile-app-v1
    paths-ignore:
      - 'dist/**'

permissions:
  contents: write

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout isolated mobile branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract independent source
        shell: bash
        run: |
          rm -rf source
          mkdir source
          unzip -q DEZGRE-Mobile-v0.1.0-source.zip -d source

      - name: Build APK
        shell: bash
        working-directory: source/dezgre-mobile
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Stage APK and checksum
        shell: bash
        run: |
          mkdir -p dist
          cp source/dezgre-mobile/app/build/outputs/apk/debug/app-debug.apk dist/DEZGRE-Mobile-v0.1.0.apk
          sha256sum dist/DEZGRE-Mobile-v0.1.0.apk | tee dist/DEZGRE-Mobile-v0.1.0.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DEZGRE-Mobile-v0.1.0
          path: |
            dist/DEZGRE-Mobile-v0.1.0.apk
            dist/DEZGRE-Mobile-v0.1.0.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK on isolated branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/DEZGRE-Mobile-v0.1.0.apk dist/DEZGRE-Mobile-v0.1.0.apk.sha256
          if ! git diff --cached --quiet; then
            git commit -m "build: publish DEZGRE Mobile v0.1.0 APK [skip ci]"
            git push origin HEAD:mobile-app-v1
          fi
