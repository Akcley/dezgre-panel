plugins {
    id 'com.android.application'
}

// google-services is activated only when the Firebase project config is present.
// This keeps CI/builds honest instead of inventing Firebase identifiers.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

def previewKeystore = System.getenv('DEZGRE_PREVIEW_KEYSTORE')
def previewStorePassword = System.getenv('DEZGRE_PREVIEW_STORE_PASSWORD') ?: 'dezgre-preview-v1'
def previewKeyAlias = System.getenv('DEZGRE_PREVIEW_KEY_ALIAS') ?: 'dezgre-preview'
def previewKeyPassword = System.getenv('DEZGRE_PREVIEW_KEY_PASSWORD') ?: 'dezgre-preview-v1'
def buildVersionCode = (System.getenv('DEZGRE_VERSION_CODE') ?: '2').toInteger()
def buildVersionName = '0.1.21'

android {
    namespace 'com.dezgre.mobile'
    compileSdk 35

    signingConfigs {
        previewStable {
            if (previewKeystore) {
                storeFile file(previewKeystore)
                storePassword previewStorePassword
                keyAlias previewKeyAlias
                keyPassword previewKeyPassword
            }
        }
    }

    defaultConfig {
        applicationId 'com.dezgre.mobile'
        minSdk 23
        targetSdk 35
        versionCode buildVersionCode
        versionName buildVersionName
    }

    buildTypes {
        debug {
            applicationIdSuffix '.preview'
            versionNameSuffix '-preview'
            if (previewKeystore) {
                signingConfig signingConfigs.previewStable
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-messaging'
}
